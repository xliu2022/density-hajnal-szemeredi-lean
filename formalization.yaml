version: v0.4
project:
  name: Density Hajnal–Szemerédi formalization
  description: 'Lean formalization of the density Hajnal–Szemerédi theorem: uniform finite integral extremal
    density, weighted and graphon density, the complete B/A/R equality classification including every
    transition and endpoint, uniform finite and graphon stability with its corollaries, and perfect rainbow
    clique factors. All principal mathematical results are proved; official Palomar verification and registration
    remain pending.'
  authors:
  - Xizhi Liu
  license: Apache-2.0
  responsible_maintainers:
  - Xizhi Liu
classification:
  arxiv:
  - math.CO
  msc2020:
  - 05C35
  - 05C70
sources:
- title: The density Hajnal–Szemerédi theorem
  type: paper
  location: source/manuscript.tex
  relationship: formalizes
  note: User-supplied manuscript uploaded 2026-11-25, retained as source/manuscript.tex. The development
    proves all principal results. The independent Challenge states the selected claims explicitly.
  license: unknown
related_formalizations:
- id: https://github.com/cameronfreer/graphon/tree/9f7be59fa754d260a544b4cfd83d6a5b94f7552e
  relationship: adapts
  note: >-
    This project adapts the compactness, metric quotient, overlay, and related proofs from
    Cameron Freer’s “Graphon: a Lean library for graph limits” (Apache-2.0).
    DensityHS/Vendor/UPSTREAM.json records the upstream commit and tree.
    See docs/graphon-dependency-audit.md for the local adaptations.
status:
  scope: 'All principal mathematical results and their supporting proof chains are complete and compiled:
    the uniform finite integral density theorem, the weighted density theorem for every r at least two,
    genuine graphon tiling-cover strong duality and density, complete B/A/R equality including both endpoints
    and every transition, unconditional uniform finite and graphon L1 stability, sequence and compact
    unique-range stability, and the perfect rainbow clique-factor theorem. Actual compactness, lower semicontinuity,
    finite transference, prescribed integer realization/edit rounding, nonsmooth variation, terminating
    uncrossing, phase diagram, and all appendix estimates are supplied. General external results cited
    by the manuscript are replaced where appropriate by proofs of the precise consequences needed. Official
    Comparator acceptance, public repository registration, and human mathematical review remain pending.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
automation:
  methods:
  - method: agent
    models:
    - GPT-6 Astra Pro
    framework: ChatGPT
    tool_setup: Parallel proof development with Lean compilation, mathlib source inspection, exact rational
      and polynomial tactics, and axiom audits.
    cost:
      wall_time: not tracked
      spend_usd: not tracked
      hardware: managed Linux workspace
    prompting_notes: Formalize the supplied manuscript, with Xizhi Liu as author and maintainer, and satisfy
      current Palomar requirements.
  spend_usd: not tracked
  notes: All principal proofs and the independent statement bridges were developed by parallel proof agents
    with repeated Lean compilation and transitive axiom audits. A separate read-only automated review
    checked the manuscript/statement correspondence. No human mathematical review is recorded. The official
    sandboxed Comparator is blocked by the workspace network-namespace restriction; standalone kernel
    replay is recorded separately.
fidelity:
  divergences: 'Several finite arguments are reproved directly: matching via extreme half-integral covers;
    complete support via a one-level extreme-cover characterization; support classification via finite
    quadratic witnesses and a dominating edge, without spectral interlacing; the terminal bound via a
    finite marked-set inequality. The finite integral upper bound uses actual Szemeredi regularity and
    rounding instead of graphon transfer. B and A lower constructions use equal-sized core parts and fewer
    than r isolated remainders, preserving the required uniform asymptotic value. Kernel density uses
    support sampling and infimum continuity. No graphon or rainbow theorem is inferred from unproved external
    results. Graphon strong duality is proved by actual Hilbert separation and explicit marginal trimming.
    The compactness port preserves the upstream proofs and adapts namespace/module visibility and changed
    mathlib APIs. The final B/R crossing is proved directly by marked-region, shifted-neighbor, and residual-integral
    arguments rather than assuming an external marked Turan equality theorem. The rainbow argument replaces
    an overstrong quoted blow-up assertion with explicit bad-map counting and the exact rainbow extraction
    theorem required; the source counterexample and repair are documented in docs/rainbow-source-audit.md.
    The independent graphon statement surface uses the standard unit-interval model. Graphon.UnitRepresentation
    formally proves the measure-preserving reduction from every standard Borel atomless probability space
    and exact preservation of density and all positive-order tiling numbers. The registered weighted result
    uses the arbitrary feasible-cover formulation; optimal-cover attainment and duality supply the optimum-value
    formulation.'
review:
  status: principal mathematical results machine-checked; official submission verification pending
  reviewers:
  - none
  notes: All nine independent Challenge/Solution statements and the full mathematical root compile. Solution
    never imports Challenge. Nine deliberate Challenge proof holes are excluded from the zero proof-development
    sorry counts. A read-only automated statement-fidelity review found no material mismatch; this is
    not human review. Standalone kernel replays and namespace axiom evidence are recorded in verification/REPORT.md.
    The official sandboxed Comparator was retried but cannot create a network namespace in this workspace;
    no official acceptance or registration is claimed.
alignment:
